# CI: GitHub ホストの runner で実行する。
#
# **self-hosted は使わない。** 公開リポジトリで self-hosted を使うと、fork からの
# pull request が**自分のマシン上で任意のコードを実行できる**（GitHub が明示的に警告している）。
# 「他人に CI を触らせない」を満たすのは、隔離された使い捨ての runner のほうである。
# 公開リポジトリなら GitHub ホストの標準 runner は分数を消費しない
# （2,000 分/月の制限と windows 2 倍・macOS 10 倍の係数は private のときだけ）。
#
# matrix に windows と macOS を入れるのは、プラットフォーム依存部分を実機で通すためである。
# platform_info.py の ctypes 経路（GetTickCount64 / OpenProcess）と sysctl 経路
# （kern.boottime）は、それぞれ Windows と macOS でしか実行されない。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest

  # 利用者と同じ手順で入れて、往復するところまで確かめる。
  # **配布層は書いた本人の環境では検証できない。** 開発機には rb が PATH にあり、
  # Git Bash があり、Python が新しい。その条件が偽になったときにだけ現れる欠陥が
  # 実際に複数出た（cmd の終了コード、cp932 でのバッチ破損、Store スタブ）。
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install as a user would
        run: uv tool install .
      - name: Round trip
        shell: bash
        env:
          RESOURCE_BROKER_HOME: ${{ runner.temp }}/rb-ci
        run: |
          set -eu
          rb --help > /dev/null
          rb claim CI-RESOURCE --job "CI round trip" \
             --observed "temporary board on CI; no real resource is touched" \
             --eta 5m --found free
          rb status | grep -q CI-RESOURCE
          # 生きた宣言があれば 2 度目の claim は 1 で戻る（段差が効いていること）
          if rb claim CI-RESOURCE --job x --observed y --eta 1m; then
            echo "a declared resource was claimed again without --share" >&2; exit 1
          fi
          # --share を付ければ並べる（意思表示であって、掲示板には役割として残らない）
          rb claim CI-RESOURCE --job "alongside" --observed y --eta 1m --found busy --share
          test "$(rb status --json | python -c 'import json,sys; print(len(json.load(sys.stdin)["resources"][0]["declarations"]))')" = 2
          rb release CI-RESOURCE
          rb status | grep -q "掲示板は空です" 

  # プラグインとしての妥当性。Claude Code は npm で入るので CI で回せる。
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the plugin manifest
        run: npx --yes @anthropic-ai/claude-code plugin validate .

  # 版が 3 箇所に散っている。ずれると /plugin が古い版を表示し続け、更新が届かない。
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Version consistency
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          plugin = json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text(encoding="utf-8"))["version"]
          market = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text(encoding="utf-8"))["plugins"][0]["version"]
          pyproj = re.search(r'^version = "([^"]+)"', pathlib.Path("pyproject.toml").read_text(encoding="utf-8"), re.M).group(1)
          if not plugin == market == pyproj:
              sys.exit(f"version mismatch: plugin={plugin} marketplace={market} pyproject={pyproj}")
          print(f"version ok: {plugin}")
          PY
