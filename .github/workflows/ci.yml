# CI: GitHub ホストの runner で実行する。
#
# **self-hosted runner は使わない。** 公開リポジトリで self-hosted を使うと、fork からの
# pull request が**自分のマシン上で任意のコードを実行できる**（GitHub が明示的に警告している）。
# 「他人に CI を触らせない」を満たす方法は、隔離された使い捨ての runner を使うことである。
# 公開リポジトリなら GitHub ホストの標準 runner は分数制限なしで使える。
#
# 本ツールは Windows を第一級の対象とする。以前は Linux だけで回しており、Windows 固有の
# ctypes 経路（GetTickCount64 / OpenProcess）が 1 行も実行されないという既知の穴があった。
# matrix に windows-latest を入れてその穴を塞ぐ。
#
# 本ツールは資源を調べないので、実 GPU・実 COM ポートを要求するテストは原理的に存在しない。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
