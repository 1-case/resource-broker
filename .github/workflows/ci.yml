# CI: GitHub ホストの runner で実行する。
#
# **self-hosted は使わない。** 公開リポジトリで self-hosted を使うと、fork からの
# pull request が**自分のマシン上で任意のコードを実行できる**（GitHub が明示的に警告している）。
# 「他人に CI を触らせない」を満たすのは、隔離された使い捨ての runner のほうである。
# 公開リポジトリなら GitHub ホストの標準 runner は分数を消費しない
# （2,000 分/月の制限と windows 2 倍・macOS 10 倍の係数は private のときだけ）。
#
# matrix に windows と macOS を入れるのは、プラットフォーム依存部分を実機で通すためである。
# platform_info.py の ctypes 経路（GetTickCount64 / OpenProcess）と sysctl 経路
# （kern.boottime）は、それぞれ Windows と macOS でしか実行されない。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest

  # 利用者と同じ手順で入れて、往復するところまで確かめる。
  # **配布層は書いた本人の環境では検証できない。** 開発機には rb が PATH にあり、
  # Git Bash があり、Python が新しい。その条件が偽になったときにだけ現れる欠陥が
  # 実際に複数出た（cmd の終了コード、cp932 でのバッチ破損、Store スタブ）。
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install as a user would
        run: uv tool install .
      - name: Round trip
        shell: bash
        env:
          RESOURCE_BROKER_HOME: ${{ runner.temp }}/rb-ci
        run: |
          set -eu
          rb --help > /dev/null
          rb claim CI-RESOURCE --job "CI round trip" \
             --observed "temporary board on CI; no real resource is touched" \
             --eta 5m --found free
          rb status | grep -q CI-RESOURCE
          # 生きた宣言があれば 2 度目の claim は 1 で戻る（段差が効いていること）
          if rb claim CI-RESOURCE --job x --observed y --eta 1m; then
            echo "a declared resource was claimed again without --share" >&2; exit 1
          fi
          # --share を付ければ並べる（意思表示であって、掲示板には役割として残らない）
          rb claim CI-RESOURCE --job alongside --observed y --eta 1m --found busy --share
          # **日本語で grep しない。** Windows のコンソールは cp932 で、照合の前に
          # 出力が化ける。機械可読な --json を数える。
          rb status --json > board.json
          test "$(grep -c '"nonce"' board.json)" = 2
          # 自分の宣言が 2 件あるときの release は曖昧なので拒否される（issue #8 の契約）。
          # 何も消さずに EXIT_USAGE(2) を返すことと、拒否のあと宣言が減っていないことの
          # 両方を確かめる——「拒否されたのに消えていた」は事後報告では手遅れになる事故である。
          if rb release CI-RESOURCE; then
            echo "release resolved an ambiguous (2-declaration) resource without --all/--nonce" >&2
            exit 1
          fi
          rb status --json > board.json
          test "$(grep -c '"nonce"' board.json)" = 2
          # nonce の前方一致（rb status --json に載る先頭 8 桁）で 1 本だけを狙って
          # 消せることを確かめる。**外部の処理系を仮定しない。** jq は Git Bash に無く、
          # このジョブは setup-python を持たないので python が PATH にある保証もない
          # （Windows では Store スタブに当たる）。grep と sed だけで取る。
          NONCE=$(grep -o '"nonce": "[0-9a-f]\{8\}' board.json | head -1 | sed 's/.*"//')
          rb release --nonce "$NONCE"
          rb status --json > board.json
          test "$(grep -c '"nonce"' board.json)" = 1
          # 残りは --all でまとめて消す（曖昧さの拒否を明示的に上書きする経路）。
          rb release CI-RESOURCE --all
          rb status --json > empty.json
          grep -q '"resources": \[\]' empty.json

  # プラグインとしての妥当性。Claude Code は npm で入るので CI で回せる。
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the plugin manifest
        run: npx --yes @anthropic-ai/claude-code plugin validate .

  # 版が 4 箇所に散っている。ずれると /plugin が古い版を表示し続け、更新が届かない。
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Version consistency
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          plugin = json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text(encoding="utf-8"))["version"]
          market = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text(encoding="utf-8"))["plugins"][0]["version"]
          pyproj = re.search(r'^version = "([^"]+)"', pathlib.Path("pyproject.toml").read_text(encoding="utf-8"), re.M).group(1)
          init = re.search(
              r'^__version__ = "([^"]+)"',
              pathlib.Path("src/resource_broker/__init__.py").read_text(encoding="utf-8"),
              re.M,
          ).group(1)
          if not plugin == market == pyproj == init:
              sys.exit(f"version mismatch: plugin={plugin} marketplace={market} pyproject={pyproj} init={init}")
          print(f"version ok: {plugin}")
          PY
