[project]
name = "resource-broker"
version = "0.1.0"
description = "複数の Claude Code セッション間で有限資源の使用状況を共有する掲示板"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
resource-broker = "resource_broker.cli:main"
rb = "resource_broker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_broker"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
