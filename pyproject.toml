[project]
name = "resource-broker"
version = "0.1.0"
description = "複数の Claude Code セッション間で有限資源の使用状況を共有する掲示板"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
resource-broker = "resource_broker.cli:main"
rb = "resource_broker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_broker"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
target-version = "py313"
line-length = 99
# src レイアウトで `resource_broker` を first-party と認識させる（import 並び順の判定に使う）
src = ["src"]
# 除外は置かない。tools/speak.py は folnet で育った版を引き継いでおり共有バンドルとは既に別物で、
# hooks も含めて lint / format を通す（folnet と同じ方針）

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
