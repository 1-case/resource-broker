[project]
name = "resource-broker"
dynamic = ["version"]
description = "複数の Claude Code セッション間で有限資源の使用状況を共有する掲示板"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"  # 実際に要るのは StrEnum（3.11+）だけである
dependencies = []
authors = [{ name = "satorunnlg" }]

[project.urls]
Homepage = "https://github.com/1-case/resource-broker"
Repository = "https://github.com/1-case/resource-broker"
Issues = "https://github.com/1-case/resource-broker/issues"

[project.scripts]
resource-broker = "resource_broker.cli:main"
rb = "resource_broker.cli:main"

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 の license / license-files 対応
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_broker"]

# 版の正本は src/resource_broker/__init__.py の __version__ である。ここに手書きの
# version を置かない（動的版と併存させると、更新されない側が静かに腐る）。
[tool.hatch.version]
path = "src/resource_broker/__init__.py"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
target-version = "py311"
line-length = 99
# src レイアウトで `resource_broker` を first-party と認識させる（import 並び順の判定に使う）
src = ["src"]
# 除外は置かない。tools/ と hooks/ も含めて lint / format を通す。

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
