[project]
name = "resource-broker"
version = "0.1.0"
description = "複数の Claude Code セッション間で有限資源の使用状況を共有する掲示板"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
resource-broker = "resource_broker.cli:main"
rb = "resource_broker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_broker"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
target-version = "py313"
line-length = 99
# src レイアウトで `resource_broker` を first-party と認識させる（import 並び順の判定に使う）
src = ["src"]
# templates/shared からコピーしたバンドル（hooks / speak.py）は、共有版と同一内容を保って
# 将来のバンドル更新を容易にするため lint / format 対象外（malm と同じ方針）
extend-exclude = [".claude/hooks", "tools/speak.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
